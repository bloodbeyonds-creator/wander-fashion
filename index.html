<style>
/* Layout: sticky toolbar (brand/search, collections, filters), sticky section rail on the left, dense render grid;
   selection tray docks at the bottom, viewer is a full-screen dialog. */
:root{
  --bg:#e9ecf1; --panel:#f8f9fb; --raise:#ffffff; --ink:#1a1d26; --mut:#5d6474; --line:#d3d8e1;
  --acc:#0d877e; --acc-ink:#ffffff; --pick:#a5741f; --pick-soft:#a5741f22; --new:#c2416b;
  --shot:#7c7f86;
  --f-disp:"Marcellus","Palatino Linotype",Georgia,serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-code:"JetBrains Mono",Consolas,"Cascadia Mono",monospace;
  --cw:170px; --rail:228px; --toph:120px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131a; --panel:#181b24; --raise:#1f2330; --ink:#e5e8ef; --mut:#8b92a4; --line:#2a2f3d;
  --acc:#3cc4b5; --acc-ink:#0b1b19; --pick:#e2b45c; --pick-soft:#e2b45c26; --new:#f0719a; --shot:#6f7279; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a; --panel:#181b24; --raise:#1f2330; --ink:#e5e8ef; --mut:#8b92a4; --line:#2a2f3d;
  --acc:#3cc4b5; --acc-ink:#0b1b19; --pick:#e2b45c; --pick-soft:#e2b45c26; --new:#f0719a; --shot:#6f7279; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* toolbar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:400 23px/1 var(--f-disp);letter-spacing:.02em;margin:0}
.brand small{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 32px}
.search svg{position:absolute;left:10px;top:50%;translate:0 -50%;width:15px;height:15px;stroke:var(--mut);fill:none;stroke-width:2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.size{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.size input{width:110px;accent-color:var(--acc)}
.dc{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;background:#5865f2;color:#fff;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.dc:hover{background:#4752c4}
.dc svg{width:17px;height:17px;fill:currentColor}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-basis:100%}
.row .lb{font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 4px 0 2px}
.row .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--gc,var(--mut))}
.chip span{font:500 11px var(--f-code);opacity:.75;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--gc,var(--acc));box-shadow:inset 0 0 0 1px var(--gc,var(--acc));background:color-mix(in srgb,var(--gc,var(--acc)) 12%,var(--raise))}
.games .chip{padding-left:9px}
.sw{width:24px;height:24px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);background:var(--c);cursor:pointer;padding:0;flex:none;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.chip.pm[aria-pressed="true"]{--gc:var(--pick)}
.chip.nw[aria-pressed="true"]{--gc:var(--new)}

/* frame */
.wrap{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:24px;
  padding:18px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
.rail{position:sticky;top:calc(var(--toph) + 14px);align-self:start;max-height:calc(100vh - var(--toph) - 28px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.rail h3{margin:0 0 4px;font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.rail .gm{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font:400 17px/1.1 var(--f-disp);color:var(--ink)}
.rail .gm i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.rail .gmb{border-left:2px solid color-mix(in srgb,var(--gc) 45%,transparent);padding-left:8px;display:flex;flex-direction:column;gap:10px}
.rail button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--ink)}
.rail button span{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.rail button:hover{background:var(--panel)}
.rail button[aria-current="true"]{background:var(--acc);color:var(--acc-ink)}
.rail button[aria-current="true"] span{color:inherit;opacity:.8}

/* sections */
main{min-width:0}
.shared{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:12px 14px;border-radius:10px;
  border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.shared b{font:400 18px var(--f-disp)}
.shared span{color:var(--mut);margin-right:auto}
.sec{content-visibility:auto;contain-intrinsic-size:auto 900px}
.sec+.sec{margin-top:34px}
.sec header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font:400 22px/1.15 var(--f-disp);margin:0;text-wrap:balance}
.sec header .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sec header .n{color:var(--mut);font-variant-numeric:tabular-nums}
.sec header p{flex-basis:100%;margin:0;color:var(--mut);font-size:13px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--cw),100%),1fr));gap:12px}

/* card */
.c{position:relative;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;transition:border-color .15s,box-shadow .15s}
.c:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.ph{position:relative;aspect-ratio:3/4;background:var(--shot);max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .bk{opacity:0;transition:opacity .18s}
.c:hover .bk{opacity:1}
.bd{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.bd b{font:600 9.5px/1 var(--f-code);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;color:#fff;box-shadow:0 1px 3px #0004}
.bd .p{background:var(--pick);color:#1b1407}.bd .w{background:var(--new)}
.c figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;min-height:34px}
.c code{font:500 11.5px/1.2 var(--f-code);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.mt{flex:none;display:flex;align-items:center;gap:5px;font:500 10.5px/1 var(--f-code);color:var(--mut);font-variant-numeric:tabular-nums}
.mt i{display:block;width:26px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.mt i::after{content:"";display:block;height:100%;width:calc(var(--v)*100%);background:var(--mut)}
.pick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1.5px solid #ffffffcc;background:#0006;
  display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.pick svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.c:hover .pick,.pick:focus-visible{opacity:1}
.c.sel{border-color:var(--pick);box-shadow:0 0 0 1px var(--pick),0 6px 18px var(--pick-soft)}
.c.sel .pick{opacity:1;background:var(--pick);border-color:var(--pick)}
.c.sel code{color:var(--pick)}
@media (hover:none){.pick{opacity:.85}}

.empty{padding:60px 0;text-align:center;color:var(--mut)}
.empty b{display:block;font:400 22px var(--f-disp);color:var(--ink);margin-bottom:6px}

/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raise);border-top:1px solid var(--line);box-shadow:0 -8px 24px #0002;
  padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tray strong{font:400 18px var(--f-disp);color:var(--pick);white-space:nowrap}
.chips{flex:1 1 260px;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font:500 11.5px var(--f-code);cursor:pointer;white-space:nowrap}
.chips button:hover{border-color:var(--pick)}
.chips button::after{content:" ×";color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.dsc{background:#5865f2;border-color:#5865f2;color:#fff}
.btn[aria-pressed="true"]{border-color:var(--pick);color:var(--pick)}
.btn.warn{border-color:#c0473b;color:#c0473b}
#copyArea{position:absolute;left:-9999px}
.toast{position:fixed;left:50%;bottom:86px;translate:-50% 0;z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-weight:500;box-shadow:0 6px 20px #0004;max-width:calc(100vw - 32px);text-align:center}

/* viewer */
.view{position:fixed;inset:0;z-index:50;background:#06070bfa;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;color:#eceef3;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.vbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.vbar .nm{font:500 15px var(--f-code)}
.vbar .sc{color:#9aa1b2;font-size:13px}
.vbar .vtag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:#ffffff14;color:#d7dae2}
.vbar .vtag i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.vbar .vtag.p{background:#e2b45c;color:#1b1407;font-weight:600}
.vbar .vtag.p a{color:inherit}
.vbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.vbar button{border:1px solid #ffffff33;background:#ffffff10;color:#eceef3;border-radius:8px;padding:7px 12px;cursor:pointer}
.vbar button:hover{background:#ffffff22}
.vbar button.on{background:#e2b45c;border-color:#e2b45c;color:#1b1407}
.dye{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px;min-height:40px}
.dye .lb{font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#9aa1b2;margin-right:2px}
.dye .sep{width:1px;align-self:stretch;background:#ffffff26;margin:2px 4px}
.dye .sw{width:26px;height:26px;border-color:#ffffff45}
.dye .sw[aria-pressed="true"]{box-shadow:0 0 0 2px #06070b,0 0 0 4px #e2b45c}
.dye .rg{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff33;background:#ffffff10;color:#eceef3;border-radius:999px;padding:4px 11px 4px 5px;cursor:pointer;font-size:12.5px}
.dye .rg i{width:16px;height:16px;border-radius:50%;background:var(--c);border:1px solid #ffffff55}
.dye .rg[aria-pressed="true"]{border-color:#e2b45c;background:#e2b45c26}
.dye input[type=color]{width:32px;height:28px;border:1px solid #ffffff45;border-radius:6px;background:none;padding:1px;cursor:pointer}
.dye .o{border:1px solid #ffffff33;background:#ffffff10;color:#eceef3;border-radius:8px;padding:6px 11px;cursor:pointer}
.dye .o:hover{background:#ffffff22}
.dye .msg{color:#9aa1b2;font-size:12.5px}
.vimgs{display:flex;gap:14px;justify-content:center;align-items:center;min-height:0}
/* figures clip their zoomed image; the caption sits on the image */
.vimgs figure{margin:0;height:100%;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;overflow:hidden;border-radius:8px}
.vimgs img{max-height:100%;max-width:100%;border-radius:8px;background:#7c7f86;object-fit:contain;transform-origin:0 0;touch-action:none;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.vimgs figcaption{position:absolute;top:8px;left:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#0008;padding:3px 7px;border-radius:4px;pointer-events:none}
.vsim{display:flex;align-items:center;gap:10px;padding-top:12px;min-width:0}
.vsim .lb{flex:none;font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#9aa1b2}
#vsimg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;min-width:0;padding-bottom:2px}
#vsimg button{flex:none;padding:0;border:2px solid transparent;border-radius:7px;background:#7c7f86;cursor:pointer;overflow:hidden;line-height:0}
#vsimg button:hover,#vsimg button:focus-visible{border-color:#e2b45c}
#vsimg img{height:88px;aspect-ratio:3/4;object-fit:cover;display:block}
.vbar .vtag.q,.bd .q{color:#fff}
.q.istendi{background:#4b7bd6!important}.q.yapiliyor{background:#d9822b!important}.q.hazir{background:#2e9b6a!important}
.dye .rg{white-space:nowrap}.dye .rg .ar{color:#9aa1b2;font-weight:400}
.dhint{color:#e2b45c;font-size:12.5px}

/* compare */
.cmp{position:fixed;inset:0;z-index:45;background:#06070b;display:grid;grid-template-rows:auto minmax(0,1fr);color:#eceef3;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.cmp .seg{background:#ffffff10;border-color:#ffffff33}.cmp .seg button{color:#c9cdd8}
.cgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;min-height:0}
.cgrid figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;min-width:0}
.cgrid img{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;cursor:zoom-in}
.cgrid figcaption{display:flex;align-items:center;gap:8px;font:500 13px var(--f-code)}
.cgrid figcaption i,.chips button i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);border:1px solid #fff5;vertical-align:-1px}
.chips button i{margin-left:3px;border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.cgrid .x{border:1px solid #ffffff33;background:#ffffff10;color:#eceef3;border-radius:6px;width:26px;height:26px;cursor:pointer;line-height:1}

/* collage */
.colm{position:fixed;inset:0;z-index:58;background:#06070be8;display:grid;place-items:center;padding:16px}
.colm .box{background:var(--raise);color:var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;max-width:min(980px,100%);max-height:100%;min-height:0}
.colm img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border-radius:8px;min-height:0;align-self:center}
.colm .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.colm .acts span{margin-right:auto;color:var(--mut);font-size:13px}
.btn.rn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px}
.btn.rn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.chip.rq[aria-pressed="true"]{--gc:#4b7bd6}
.seg.lang button{padding:7px 9px;font:500 12px var(--f-code)}
.nav{position:fixed;top:50%;translate:0 -50%;width:44px;height:64px;border:0;border-radius:10px;background:#ffffff14;color:#fff;font-size:26px;cursor:pointer}
.nav:hover{background:#ffffff2a}
.nav.l{left:max(8px,env(safe-area-inset-left))}.nav.r{right:max(8px,env(safe-area-inset-right))}
.keys{color:#7f8698;font-size:12px}

@media (max-width:860px){
  .row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.row>*{flex:none}
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{position:static;max-height:none;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail h3,.rail .gm{display:none}
  .rail div,.rail .gmb{display:contents}
  .rail button{flex:none;width:auto;gap:8px;border:1px solid var(--line);background:var(--panel)}
  .size{display:none}
  .dc .t{display:none}
  .vimgs{flex-direction:column}.vimgs figure{height:50%}
  .dye{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.dye>*{flex:none}
  .nav{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));translate:none}
  .keys{display:none}
  .vsim .lb{display:none}#vsimg img{height:60px}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:46vh;overflow-y:auto;align-content:start}.cgrid figure{height:46vh}
  .btn.rn span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="top" id="top">
  <div class="brand"><h1>Wander Fashion</h1><small id="tot"></small></div>

    <input id="q" type="search" data-tp="search" autocomplete="off"></label>
  <div class="seg" role="group" data-ta="sex" id="sex">

  }catch(e){if(tk===dyeTok)$("dmsg").textContent=t("d_site");return false}
}
async function dyeShow(){
  if(!dye||!(await dyeReady()))return;
  const c=dye.cols;
  if(!Object.keys(c).length){$("vf").src=img(dye.it,"f",1);$("vb").src=img(dye.it,"b",1);return}
  $("vf").src=paintAll(dye.f,dye.regs,c);$("vb").src=paintAll(dye.b,dye.regs,c);
}
function dyeSave(){const id=dye.it.id;delete ovr[id];
  if(Object.keys(dye.cols).length)dyes[id]={...dye.cols};else delete dyes[id];
  store.set("wfdye",dyes);setHash();tray();dyeUi()}
function dyePick(col){if(!dye)return;dye.cols[dye.r]=col;dyeSave();dyeShow()}
$("dpal").onclick=e=>{const b=e.target.closest(".sw");if(b)dyePick(b.dataset.c)};
let dct=0;$("dcol").oninput=e=>{clearTimeout(dct);const v=e.target.value;dct=setTimeout(()=>dyePick(v),60)};
$("dorig").onclick=()=>{if(!dye)return;dye.cols={};dyeSave();dyeShow()};
$("dreg").onclick=e=>{const b=e.target.closest(".rg");if(!b)return;dye.r=+b.dataset.r;dyeUi()};

// ---------------------------------------------------------------- compare (selected items side by side)
let cmpIds=[],cmpSide="f",cmpTok=0;const CMP_MAX=6;
function cmpOpen(){if(sel.size<2){toast(t("cmp_need"));return}
  cmpIds=selIds().slice(0,CMP_MAX);if(sel.size>CMP_MAX)toast(t("cmp_max",CMP_MAX));
  $("cmp").hidden=false;document.body.style.overflow="hidden";cmpRender()}
function cmpClose(){$("cmp").hidden=true;cmpTok++;if(!vid)document.body.style.overflow=""}
async function cmpRender(){const side=cmpSide,tk=++cmpTok;
  $("cmpn").textContent=t("items",cmpIds.length);
  $("cmps").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===side));
  $("cgrid").style.setProperty("--n",cmpIds.length);
  $("cgrid").innerHTML=cmpIds.map(k=>`<figure data-k="${k}"><img src="${img(byId.get(k),side,1)}" alt="#${k}"><figcaption><code>#${k}</code>${dotsOf(k)}<button class="x" data-k="${k}" aria-label="${t("rm")}">×</button></figcaption></figure>`).join("");
  for(const k of cmpIds){const c=dyesOf(k);if(!c)continue;
    try{const v=await prepItem(byId.get(k));if(tk!==cmpTok)return;const im=$("cgrid").querySelector(`figure[data-k="${k}"] img`);if(im)im.src=paintAll(side==="f"?v.f:v.b,v.regs,c)}catch(e){}}}
$("cmpb").onclick=cmpOpen;$("cmpx").onclick=cmpClose;
$("cmps").onclick=e=>{const b=e.target.closest("button");if(b){cmpSide=b.dataset.v;cmpRender()}};
$("cgrid").onclick=e=>{const x=e.target.closest(".x");
  if(x){cmpIds=cmpIds.filter(k=>k!==x.dataset.k);cmpIds.length?cmpRender():cmpClose();return}
  const f=e.target.closest("figure");if(f&&e.target.tagName==="IMG")open(f.dataset.k)};

// ---------------------------------------------------------------- collage (one PNG of the selection for Discord)
const COL_MAX=40;let colUrl=null,colBlob=null;
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
async function collage(){
  const ids=selIds().slice(0,COL_MAX);if(!ids.length)return;
  toast(sel.size>COL_MAX?t("col_max",COL_MAX):t("col_prep"));
  try{await Promise.all(['400 34px Marcellus','500 16px "JetBrains Mono"','500 15px Inter'].map(f=>document.fonts.load(f)))}catch(e){}
  const n=ids.length,cols=n===1?1:n<=4?2:n<=9?3:4,rows=Math.ceil(n/cols);
  const IW=240,IH=320,GAP=8,G=18,CW=IW*2+GAP,LH=34,CH=IH+LH,PAD=28,HEAD=106;
  const W=PAD*2+cols*CW+(cols-1)*G,H=HEAD+rows*CH+(rows-1)*G+PAD;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#11131a";x.fillRect(0,0,W,H);
  x.fillStyle="#e5e8ef";x.font='400 34px Marcellus, Georgia, serif';x.fillText("Wander Fashion",PAD,PAD+30);
  x.fillStyle="#8b92a4";x.font='500 15px Inter, "Segoe UI", sans-serif';x.fillText(t("col_sub",n)+"   ·   discord.gg/wandermaps",PAD,PAD+56);
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(X,Y,w,h,r):x.rect(X,Y,w,h)};
  try{
    for(let k=0;k<n;k++){const id=ids[k],it=byId.get(id),cx=PAD+(k%cols)*(CW+G),cy=HEAD+Math.floor(k/cols)*(CH+G),cd=dyesOf(id);
      let fs=img(it,"f",1),bs=img(it,"b",1);
      if(cd){try{const v=await prepItem(it);fs=paintAll(v.f,v.regs,cd);bs=paintAll(v.b,v.regs,cd)}catch(e){}}
      const [a,b]=await Promise.all([loadImg(fs),loadImg(bs)]);
      for(const[im,ox]of[[a,0],[b,IW+GAP]]){x.save();rr(cx+ox,cy,IW,IH,8);x.clip();x.fillStyle="#7c7f86";x.fillRect(cx+ox,cy,IW,IH);x.drawImage(im,cx+ox,cy,IW,IH);x.restore()}
      x.fillStyle="#e2b45c";x.font='500 16px "JetBrains Mono", Consolas, monospace';x.fillText("#"+id,cx,cy+IH+24);
      if(cd){let dx=cx+x.measureText("#"+id).width+12;
        Object.keys(cd).sort().forEach(r=>{x.beginPath();x.arc(dx+6,cy+IH+19,6,0,7);x.fillStyle=cd[r];x.fill();x.strokeStyle="#ffffff66";x.stroke();dx+=17})}
    }
    colBlob=await new Promise(r=>c.toBlob(r,"image/png"));
    if(!colBlob)colBlob=await (await fetch(c.toDataURL("image/png"))).blob();
  }catch(e){toast(t("col_site"));return}
  if(colUrl)URL.revokeObjectURL(colUrl);colUrl=URL.createObjectURL(colBlob);
  $("colimg").src=colUrl;$("coldl").href=colUrl;$("colcp").hidden=!(navigator.clipboard&&window.ClipboardItem);$("colm").hidden=false;$("toast").hidden=true;
}
$("colb").onclick=collage;
$("colx").onclick=()=>$("colm").hidden=true;
$("colm").onclick=e=>{if(e.target===$("colm"))$("colm").hidden=true};
$("colcp").onclick=()=>navigator.clipboard.write([new ClipboardItem({"image/png":colBlob})]).then(()=>toast(t("col_ok")),()=>toast(t("nocopy")));

// ---------------------------------------------------------------- search / sex / language
let qt=0;$("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value;render()},120)};
function syncSex(){$("sex").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===st.sex))}
$("sex").onclick=e=>{const b=e.target.closest("button");if(!b)return;unshare();st.sex=b.dataset.v;store.set("wfsex",st.sex);syncSex();games();rail();render()};
syncSex();
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-t]").forEach(e=>{if(!e.closest("#filt,#games,#rail,#main"))e.textContent=t(e.dataset.t)});
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t(e.dataset.tp));
  document.querySelectorAll("[data-ta]").forEach(e=>{e.setAttribute("aria-label",t(e.dataset.ta));e.title=t(e.dataset.ta)});
  $("lang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===LANG));
  $("tot").textContent=t("items",all.length);
  $("view").setAttribute("aria-label",t("view"));$("cmp").setAttribute("aria-label",t("cmp_t"));$("colm").setAttribute("aria-label",t("t_col"));
}
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.v===LANG)return;LANG=b.dataset.v;store.set("wflang",LANG);
  applyLang();games();filt();rail();render();tray();if(vid)open(vid);if(!$("cmp").hidden)cmpRender()};
applyLang();

// links: #l=0001.0155~0b8322a (shared list, with colours), #i=1794~11c2c66 (one item)
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1)),eq=h.indexOf("="),k=h.slice(0,eq),v=h.slice(eq+1);
  if(k==="l"&&v){const toks=v.split(/[.,\s]+/).map(parseTok).filter(([id])=>byId.has(id));
    if(toks.length){st.shared=new Set(toks.map(x=>x[0]));toks.forEach(([id,c])=>{if(c)ovr[id]=c});st.sharedHash=toks.map(([id,c])=>id+(c?Object.keys(c).sort().map(r=>"~"+r+c[r].slice(1)).join(""):"")).join(".");refresh();return}}
  refresh();
  if(k==="i"){const [id,c]=parseTok(v);if(byId.has(id)){if(c)ovr[id]=c;
    if(!vis.includes(id)){Object.assign(st,{sec:"all",sex:"all",game:"all",ty:"all",col:null,pm:false,nw:false,only:false});syncSex();refresh()}open(id)}}
}
fromHash();
